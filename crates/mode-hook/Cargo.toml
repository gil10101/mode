[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Toolhelp32 for the parent pid and the console window as the tty equivalent (05 §9.1).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
